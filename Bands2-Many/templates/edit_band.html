
{% extends "base.html" %}

{% block content %}

<h2>Edit Band</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Band Name</label>
        <input type="text" name="bandname"
               class="form-control"
               value="{{ band.BandName }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Formed Year</label>
        <input type="number" name="formedyear"
               class="form-control"
               value="{{ band.FormedYear or '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Home Location</label>
        <input type="text" name="homelocation"
               class="form-control"
               value="{{ band.HomeLocation or '' }}">
    </div>

    <button type="submit" class="btn btn-primary">
        Save Changes
    </button>

</form>

{% endblock %}

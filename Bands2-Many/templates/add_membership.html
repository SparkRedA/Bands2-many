
{% extends "base.html" %}

{% block content %}

<h2>Add Membership</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Band</label>
        <select name="bandid" class="form-select" required>
            <option value="">Select Band</option>

            {% for band in bands %}
            <option value="{{ band.BandID }}">
                {{ band.BandName }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Member</label>
        <select name="memberid" class="form-select" required>
            <option value="">Select Member</option>

            {% for member in members %}
            <option value="{{ member.MemberID }}">
                {{ member.MemberName }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Role</label>
        <input type="text" name="role" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Start Year</label>
        <input type="number" name="startyear" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">End Year</label>
        <input type="number" name="endyear" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">
        Add Membership
    </button>

</form>

{% endblock %}

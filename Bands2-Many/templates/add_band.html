
{% extends "base.html" %}

{% block content %}

<h2>Add Band</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Band Name</label>
        <input type="text" name="bandname"
               class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Formed Year</label>
        <input type="number" name="formedyear"
               class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Home Location</label>
        <input type="text" name="homelocation"
               class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">
        Add Band
    </button>

</form>

{% endblock %}
